[project]
name = "vn_office_ai"
authors = [
    { name = "Nguyen Huy Chien", email = "mrhuychien@gmail.com" }
]
description = "AI văn phòng cho doanh nghiệp Việt — soạn tài liệu & phân tích kế toán native trên ERPNext v16"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # Frappe + ERPNext do bench quản lý; liệt kê ở đây để tài liệu hoá.
    # python-docx: convert HTML → .docx cho Tier 1 (doc generative).
    # beautifulsoup4: parse HTML AI sinh ra.
    # openpyxl: parse file .xlsx ở Tier 2 (thường Frappe đã bundle sẵn).
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "openpyxl>=3.1.0",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# KHÔNG pin frappe-dependencies để tránh chặn install trên v16.
# required_apps trong hooks.py đã đảm bảo erpnext có mặt.

[tool.flit.module]
name = "vn_office_ai"
